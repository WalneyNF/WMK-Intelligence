name: Testes WMK Intelligence
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe Python
        run: python -m compileall -q wmk tests
      - name: Validar configuracao JSON
        run: python -m json.tool config/fontes.json > /dev/null
      - name: Executar testes offline
        run: python -m unittest discover -s tests -v
