<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neural Database Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#030b14;color:#bceeff;font:14px system-ui}header,footer{padding:12px;background:#0a2030;display:flex;gap:12px;align-items:center}a,button{color:#65eaff}button,select,textarea,input{background:#0b2030;color:#bceeff;border:1px solid #36788e;padding:9px}button{cursor:pointer}main{display:grid;grid-template-columns:1fr 3fr 1fr;gap:8px;padding:8px;height:calc(100dvh - 100px)}aside{display:grid;gap:8px;align-content:stretch}aside button{min-height:60px}section{position:relative;overflow:hidden;border:1px solid #36788e;background:radial-gradient(ellipse,#17475d,#030b14)}#photo{position:absolute;width:100%;height:100%;object-fit:contain}#beam{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 45%,#65eaff33 50%,transparent 55%);animation:scan 7s linear infinite}@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(100%)}}#counts{position:absolute;top:12px;left:12px;background:#030b14dd;padding:10px}dialog{width:min(1100px,95vw);height:85vh;background:#071725;color:#bceeff;border:1px solid #65eaff}dialog::backdrop{background:#0009}textarea{width:100%;height:100px}#result{overflow:auto;max-height:45vh}table{border-collapse:collapse;font-size:12px}td,th{border:1px solid #28566c;padding:7px;max-width:400px;overflow-wrap:anywhere;vertical-align:top}pre{white-space:pre-wrap}#fallback{position:absolute;inset:30%;text-align:center}body.paused #beam{animation-play-state:paused}@media(prefers-reduced-motion:reduce){#beam{animation:none}}@media(max-width:700px){main{grid-template-columns:1fr 1fr;height:auto}section{grid-column:1/-1;grid-row:1;height:50vh}}</style><header><b>WMK NEURAL DATABASE STUDIO · v0.1</b><span>🔒 Somente leitura</span><a href="/prime.html" target="_top">Central</a><button id="pause">Pausar animação</
