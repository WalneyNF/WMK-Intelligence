<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WMK SQL Library</title><style>*{box-sizing:border-box}body{margin:0;background:#081522;color:#d5eaff;font:15px system-ui}header,footer{padding:14px;background:#102c40}a{color:#75eaff}main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;padding:12px}aside,section{background:#102334;padding:12px;border:1px solid #28566c;border-radius:8px;min-width:0}aside{max-height:80vh;overflow:auto}button,input,textarea,select{font:inherit;color:#d5eaff;background:#17384d;border:1px solid #39748c;border-radius:4px;padding:8px}button{cursor:pointer}aside button{display:block;width:100%;text-align:left;margin:5px 0}input,textarea{width:100%;margin:5px 0}textarea{resize:vertical}#sql{font:15px monospace}nav{display:flex;gap:6px;flex-wrap:wrap}#result{overflow:auto;max-height:45vh}table{border-collapse:collapse;width:100%}td,th{border:1px solid #36546a;padding:8px;text-align:left;overflow-wrap:anywhere}th{background:#17384d;position:sticky;top:0}h2{color:#75eaff}@media(max-width:700px){main{grid-template-columns:1fr}aside{max-height:35vh}}</style><header><b>WMK SQL LIBRARY · v0.1</b> · <a href="/database-studio.html">Database Studio</a> · <a href="/">Central</a> · Memória somente leitura</header><main><aside><input id="filter" placeholder="Pesquisar consultas"><select id="category"><option value="">Todas as categorias</option></select><div id="list"></div></aside><section><h2>Editor de consultas</h2><input id="name" placeholder="Nome"><input id="cat" placeholder="Categoria"><textarea id="description" rows="2" placeholder="Explicação em português"></textarea><textarea id="sql" rows="9" spellcheck="false" placeholder="SELECT ..."></textarea><nav><button id="new">Nova</button><button id="save">Salvar</button><button id="duplicate">Duplicar</button><button id="delete">Excluir</button><button id="run">Executar SQL</button><button id="export">Exportar consulta JSON</button><button id="import">Importar JSON</button><input type="file" id="file" accept=".json" hidden></nav><p id="status" role="status"></p><div id="result"></div></section></main><footer>Walney Moreira Klein — walneyk@hotmail.com</footer><script src="/sql-library.js"></script></html>
